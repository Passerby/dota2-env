[project]
name = "dota2-env"
version = "0.1.0"
description = "Python <-> Dota 2 bot-script bridge (worldstate socket + Lua action files), extracted from LastOrder-Dota2"
requires-python = ">=3.10"
dependencies = ["protobuf>=5.29", "gymnasium>=1.0", "numpy"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["dota2_env"]

[project.optional-dependencies]
dev = ["pytest", "ruff>=0.16", "pre-commit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]

# Style rules live in AGENTS.md; ruff enforces the mechanical half of them.
[tool.ruff]
line-length = 120
target-version = "py310"
# Generated by protoc, never hand-edited.
extend-exclude = ["*_pb2.py", "*_pb2.pyi"]

[tool.ruff.lint]
select = [
    "E", "W",    # pycodestyle
    "F",         # pyflakes: undefined and unused names
    "I",         # isort: stdlib / third-party / local import groups
    "UP",        # pyupgrade: modern syntax, X | Y over Optional[X]
    "B",         # bugbear: mutable defaults, loop-variable capture
    "SIM",       # flake8-simplify: collapsible branches, redundant conditionals
    "C4",        # comprehensions over list()/dict() calls
    "RET",       # flake8-return: early return, no redundant else
    "PIE",       # misc lints: dead code, duplicate class fields
    "N",         # pep8-naming
    "A",         # builtin shadowing
    "ISC",       # implicit string concatenation
    "LOG",       # logging misuse
    "Q",         # quote style
    "RUF",       # ruff-specific: mutable class defaults, unused noqa, unused unpacks
    "PLC", "PLE", "PLW",  # pylint convention / error / warning
]
# ISC001 is what the formatter already handles; PL refactor rules (PLR) are off because
# DotaMid1v1Env.__init__ legitimately takes one keyword per env parameter.
ignore = ["ISC001"]

[tool.ruff.lint.per-file-ignores]
# do_GET is the method name http.server dispatches to.
"scripts/probe_http.py" = ["N815"]

[tool.ruff.lint.flake8-quotes]
inline-quotes = "single"

[tool.ruff.lint.isort]
known-first-party = ["dota2_env"]

[tool.ruff.format]
quote-style = "single"
